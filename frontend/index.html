<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Map</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Memory Map</h1>
    <p>사진·메모 기반 인간관계 기억지도</p>
  </header>
  <main>
    <section class="panel">
      <h2>사람 추가</h2>
      <form id="person-form">
        <input name="name" placeholder="이름" required>
        <div class="autocomplete-wrapper">
          <input name="relation" id="add-relation-input" list="relation-options" placeholder="관계 (예: 대학 동기)" autocomplete="off">
          <div id="add-relation-autocomplete" class="autocomplete-dropdown" style="display: none;"></div>
        </div>
        <div id="person-relation-chips" class="relation-chips"></div>
        <input name="contact_cycle_days" type="number" min="1" placeholder="연락 주기(일, 기본값 30)">
        <button>추가</button>
      </form>
      <datalist id="relation-options"></datalist>
    </section>

    <section class="panel">
      <div class="panel-header-row">
        <h2>만남 기록</h2>
        <div class="toolbar-actions">
          <button type="button" class="btn-xs" id="btn-meeting-expand-all" title="모든 날짜 펼치기">모두 펼치기</button>
          <button type="button" class="btn-xs" id="btn-meeting-collapse-all" title="모든 날짜 접기">모두 접기</button>
        </div>
      </div>
      <form id="meeting-form">
        <input name="met_at" type="datetime-local" required>
        <div class="autocomplete-wrapper">
          <input name="place_name" id="place-search-input" placeholder="장소 검색 (예: 강남 카페)" autocomplete="off">
          <input name="place_lat" type="hidden" id="place-lat">
          <input name="place_lon" type="hidden" id="place-lon">
          <div id="place-autocomplete" class="autocomplete-dropdown" style="display: none;"></div>
        </div>
        <div class="people-picker-box">
          <label class="picker-label">함께한 사람 <span class="meta" style="font-weight:normal;">(필수)</span></label>
          <div id="selected-people" class="selected-people-tags"></div>
          <div class="autocomplete-wrapper">
            <input id="person-search-input" placeholder="이름 또는 관계 입력 (예: 철수, 대학 동기)" autocomplete="off">
            <div id="person-autocomplete" class="autocomplete-dropdown" style="display: none;"></div>
          </div>
        </div>
        <textarea name="memo" rows="3" placeholder="자유 메모"></textarea>
        <button>기록</button>
      </form>
      <!-- 만남 기록 날짜 필터 -->
      <div class="meeting-filter-bar">
        <label for="meeting-date-filter" class="sort-label">📅 날짜 조회:</label>
        <input type="date" id="meeting-date-filter" class="date-filter-input">
        <button type="button" class="btn-xs" id="btn-meeting-clear-filter">전체 보기</button>
      </div>
      <div id="meeting-list"></div>
    </section>

    <section class="panel">
      <div class="panel-header-row">
        <h2>사람</h2>
        <div class="toolbar-actions">
          <button type="button" class="btn-xs" id="btn-expand-all" title="모든 카테고리 펼치기">모두 펼치기</button>
          <button type="button" class="btn-xs" id="btn-collapse-all" title="모든 카테고리 접기">모두 접기</button>
        </div>
      </div>
      <div class="panel-sort-bar">
        <label for="person-sort-select" class="sort-label">정렬:</label>
        <select id="person-sort-select" class="select-xs">
          <option value="name_asc">가나다순</option>
          <option value="frequency_high">만남 빈도 높은순</option>
          <option value="frequency_low">만남 빈도 낮은순</option>
          <option value="meeting_desc">만남 횟수 많은순</option>
          <option value="meeting_asc">만남 횟수 적은순</option>
        </select>
      </div>
      <div id="person-list"></div>

      <!-- 삭제한 인물 (휴지통) -->
      <details id="deleted-section" class="deleted-section">
        <summary class="deleted-summary">
          <span>🗑️ 삭제한 인물 (<span id="deleted-count">0</span>명)</span>
          <span class="meta" style="font-size: 11px;">30일 후 완전 삭제</span>
        </summary>
        <div id="deleted-list" class="deleted-list"></div>
      </details>
    </section>

    <section class="panel wide">
      <h2>기억지도</h2>
      <div id="map" class="map-container"></div>
    </section>
  </main>
  <script src="app.js?v=13"></script>
</body>

</html>
